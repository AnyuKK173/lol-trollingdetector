services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riot_gold
      POSTGRES_USER: riot
      POSTGRES_PASSWORD: riot
    ports:
      - "5433:5432"
    volumes:
      - riot_gold_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riot -d riot_gold"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  riot_gold_pgdata:
